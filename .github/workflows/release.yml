name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 v1.1.0），将作为 Release 标签'
        required: true
        default: 'v1.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: docformat-qt
        run: pip install -r requirements.txt pyinstaller

      - name: Run engine smoke tests
        working-directory: docformat-qt
        run: python smoke_test.py

      - name: Build DocFormatPro.exe
        working-directory: docformat-qt
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name DocFormatPro
          --collect-data docx
          --icon assets/icon.ico
          --add-data "assets;assets"
          --add-data "templates;templates"
          --hidden-import scripts.formatter
          --hidden-import scripts.punctuation
          --hidden-import scripts.analyzer
          --hidden-import scripts.converter
          --hidden-import scripts.overlay
          --hidden-import win32com.client
          --hidden-import pythoncom
          --hidden-import fitz
          main.py

      - name: Rename artifact with version
        shell: pwsh
        run: |
          $ver = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          Copy-Item docformat-qt/dist/DocFormatPro.exe "DocFormatPro-$ver-windows.exe"
          echo "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFormatPro-windows
          path: DocFormatPro-*-windows.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: DocFormat Pro ${{ env.RELEASE_VERSION }}
          files: DocFormatPro-*-windows.exe
          body: |
            ## 下载哪一个

            | 平台 | 绿色版（免安装，不要管理员权限） | 安装版（装进系统，需要管理员权限） |
            |---|---|---|
            | Windows | `DocFormatPro-*-windows.exe`（本身就是绿色版，双击即用） | — |
            | 麒麟/UOS x86_64 | `DocFormatPro-*-linux-x86_64.tar.gz` | `docformat-pro_*_amd64.deb` |
            | 麒麟/UOS 飞腾/鲲鹏 ARM | `DocFormatPro-*-linux-arm64.tar.gz` | `docformat-pro_*_arm64.deb` |

            **绿色版**（推荐给个人电脑、内网拷贝分发）：解开就能用，全程不需要
            管理员密码，删掉文件夹就等于卸载干净。

            ```
            tar xzf DocFormatPro-*-linux-*.tar.gz -C ~/
            ~/DocFormatPro/启动.sh          # 双击也行
            ~/DocFormatPro/创建桌面图标.sh   # 想要桌面图标再跑这个
            ```

            包里带了「使用说明.txt」。「启动.sh」已经替你兜住两件常见的事：
            解压后可执行位丢失（用图形归档工具解压容易这样）、以及 `/tmp` 挂了
            `noexec`（不少信创机器的安全基线这么配，单文件程序会因此起不来，
            脚本会改用 `~/.cache` 下的目录）。每次发版都会用一个**没有 sudo 的
            普通用户**真跑一遍解压 → 建图标 → 启动，跑通了才发。

            **安装版**（推荐给统一部署）：`sudo dpkg -i docformat-pro_*.deb`，
            装完在开始菜单里，所有用户都能用。

            两种包都在 Debian 10 / glibc 2.28 环境构建，兼容麒麟 V10、
            统信 UOS 20 及更新系统。

            **离线系统补充依赖**：若目标机器完全离线且缺少 Qt5/xcb 等系统库，
            请下载 [离线依赖应急包](../../releases/tag/deps-v1.0)（独立发布，只需下载一次）。
            使用方法：`tar xzf DocFormatPro-deps-*.tar.gz && bash DocFormatPro-deps-*/install_deps_offline.sh /path/to/DocFormatPro/`

  build-linux:
    # 在 Debian 10 (glibc 2.28) 容器内构建，保证麒麟 V10 / UOS 20 可运行；
    # ARM 版用 GitHub 的 arm64 构建机（飞腾/鲲鹏可用）
    needs: build-windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build in Debian 10 container (glibc 2.28)
        run: |
          docker run --rm -v "$PWD":/work -w /work/docformat-qt debian:10 bash -euc '
            echo "deb http://archive.debian.org/debian buster main" > /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              python3-pip python3-setuptools python3-wheel python3-pyqt5 python3-lxml binutils
            # Debian 10 自带 pip 18 不认 manylinux2014 wheel，先升级（<24.1 仍支持 py3.7）；
            # python-docx 钉 0.8.11（1.x 需要 py3.8+），lxml 用系统包避免源码编译
            pip3 install --no-cache-dir --upgrade "pip<24.1"
            pip3 install --no-cache-dir "python-docx==0.8.11" "pyinstaller==5.13.2"
            # 套头叠加/对位校验用 PyMuPDF。它是二进制轮子，老容器或 ARM 上
            # 未必有现成 wheel；装不上不该让整个构建失败——那两个功能会在
            # 软件里置灰并说明原因，其余功能照常。
            pip3 install --no-cache-dir "PyMuPDF>=1.23.0" \
              || echo "PyMuPDF 装不上，跳过（套头叠加/对位校验将不可用）"
            FITZ_ARG=""
            python3 -c "import fitz" 2>/dev/null && FITZ_ARG="--hidden-import fitz"
            python3 smoke_test.py
            python3 -m PyInstaller --noconfirm --clean --onefile --windowed \
              --name DocFormatPro \
              --collect-data docx \
              --add-data "assets:assets" \
              --add-data "templates:templates" \
              --hidden-import scripts.formatter \
              --hidden-import scripts.punctuation \
              --hidden-import scripts.analyzer \
              $FITZ_ARG \
              --hidden-import scripts.overlay \
              main.py
          '

      - name: Package tar.gz (绿色版)
        run: |
          ver='${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}'
          mkdir -p pkg/DocFormatPro
          # 容器里是 root 建的产物，先接管过来再打包
          sudo chown -R "$(id -u):$(id -g)" docformat-qt/dist
          cp docformat-qt/dist/DocFormatPro pkg/DocFormatPro/
          cp docformat-qt/packaging/portable/* pkg/DocFormatPro/
          cp docformat-qt/assets/icon.png pkg/DocFormatPro/ || true
          # 绿色版的前提是"普通用户解开就能用"：目录 755、脚本和主程序 755、
          # 其余 644，且**所有人都可读可执行**——不能只给属主，否则换个用户
          # 拿到这个包就跑不起来了
          chmod 755 pkg/DocFormatPro
          chmod 755 pkg/DocFormatPro/DocFormatPro pkg/DocFormatPro/*.sh
          chmod 644 pkg/DocFormatPro/使用说明.txt
          [ -f pkg/DocFormatPro/icon.png ] && chmod 644 pkg/DocFormatPro/icon.png
          # 归档里把属主写成 0:0：普通用户解压时 tar 本来就忽略属主，
          # 写成 root 只会让 `tar tvf` 看着吓人，写 0 反而干净
          tar --owner=0 --group=0 --numeric-owner \
              -czf "DocFormatPro-$ver-linux-${{ matrix.arch }}.tar.gz" -C pkg DocFormatPro
          echo "RELEASE_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Verify 绿色版 runs as an unprivileged user
        run: |
          # 换一个没有 sudo 的普通用户，从零解压、创建图标、真正启动一次。
          # 绿色版最容易在"权限"上翻车，这一步就是专门盯它的——
          # 打包机上一切正常、用户机上双击没反应，就是这么来的。
          sudo useradd -m -s /bin/bash tester
          sudo install -o tester -g tester -m 644 \
            DocFormatPro-${{ env.RELEASE_VERSION }}-linux-${{ matrix.arch }}.tar.gz \
            /home/tester/green.tar.gz
          sudo -u tester -H bash -euc '
            cd ~ && tar xzf green.tar.gz
            test -x DocFormatPro/DocFormatPro || { echo "主程序没有执行位"; exit 1; }
            test -x DocFormatPro/启动.sh       || { echo "启动脚本没有执行位"; exit 1; }
            test -r DocFormatPro/使用说明.txt   || { echo "说明文件读不了"; exit 1; }

            # 桌面图标：无 root、无桌面环境下也要能装好
            ./DocFormatPro/创建桌面图标.sh
            entry=~/.local/share/applications/docformat-pro.desktop
            test -f "$entry" || { echo "桌面入口没写成"; exit 1; }
            grep -q "^Exec=.*启动.sh" "$entry" || { echo "Exec 指错了"; cat "$entry"; exit 1; }

            # 真正跑一次。--version 不开界面，没有 X 也能验
            out=$(./DocFormatPro/启动.sh --version 2>&1) || {
              echo "普通用户启动失败："; echo "$out"; exit 1; }
            echo "$out" | grep -q "DocFormat Pro" || {
              echo "启动了但输出不对："; echo "$out"; exit 1; }
            echo "普通用户启动 OK：$out"

            # 启动脚本应该把解包目录挪到家目录下（/tmp 挂 noexec 时的兜底）
            test -d ~/.cache/docformat-pro/run || {
              echo "没有改用家目录缓存，/tmp noexec 的机器上会起不来"; exit 1; }
          '
          sudo userdel -r tester

      - name: Build .deb (麒麟/UOS 双击安装包)
        run: |
          ver='${{ env.RELEASE_VERSION }}'
          arch='${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}'
          deb_name="docformat-pro_${ver#v}_${arch}"
          mkdir -p "deb/DEBIAN" "deb/opt/docformat-pro" "deb/usr/share/applications" "deb/usr/share/icons/hicolor/256x256/apps"

          # control 文件
          cat > deb/DEBIAN/control << DEBCTRL
          Package: docformat-pro
          Version: ${ver#v}
          Section: utils
          Priority: optional
          Architecture: $arch
          Depends: python3-pyqt5, python3-lxml, libqt5widgets5, libqt5gui5, libqt5core5a, libxcb-util1 | libxcb-util0
          Recommends: libreoffice-writer, wps-office
          Maintainer: DocFormat Pro Team
          Description: 公文格式自动排版工具 (GB/T 9704-2012)
           支持智能一键处理、格式诊断、标点修复、AI 粘贴生成。
           兼容麒麟 V10、统信 UOS 20 等国产 Linux 系统。
          DEBCTRL

          # postinst 脚本：安装后设权限
          cat > deb/DEBIAN/postinst << 'PST'
          #!/bin/sh
          chmod 755 /opt/docformat-pro/DocFormatPro
          update-desktop-database /usr/share/applications || true
          PST
          chmod 755 deb/DEBIAN/postinst

          # 桌面入口：装到系统里就是跑 /opt 下那个单文件，不是跑源码。
          # packaging/docformat.desktop 是**源码部署**用的模板（Exec 里还留着
          # @APP_DIR@ 占位符），直接拷进 deb 会得到一个点不开的图标。
          cat > deb/usr/share/applications/docformat-pro.desktop << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=DocFormat Pro
          Name[zh_CN]=DocFormat Pro 公文排版
          Comment=公文格式自动排版工具 (GB/T 9704-2012)
          Exec=/opt/docformat-pro/DocFormatPro
          Icon=docformat-pro
          Terminal=false
          Categories=Office;WordProcessor;
          StartupNotify=true
          DESKTOP

          cp docformat-qt/dist/DocFormatPro deb/opt/docformat-pro/
          cp docformat-qt/assets/icon.png deb/usr/share/icons/hicolor/256x256/apps/docformat-pro.png || true
          chmod 755 deb/opt/docformat-pro/DocFormatPro
          chmod 644 deb/usr/share/applications/docformat-pro.desktop

          dpkg-deb --build deb "$deb_name.deb"
          # 装完点不开是最常见的翻车方式，这里当场验一遍入口和权限
          dpkg-deb -c "$deb_name.deb" | grep -q '/opt/docformat-pro/DocFormatPro'
          dpkg-deb -c "$deb_name.deb" | grep -E 'DocFormatPro$' | grep -q 'rwxr-xr-x'
          echo "DEB_NAME=$deb_name" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFormatPro-linux-${{ matrix.arch }}
          path: |
            DocFormatPro-*-linux-*.tar.gz
            docformat-pro_*.deb

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            DocFormatPro-*-linux-*.tar.gz
            docformat-pro_*.deb
